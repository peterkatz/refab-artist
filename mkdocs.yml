site_name: Refab Artist
site_url: https://peterkatz.github.io/refab-artist/
site_description: Turn 3D models into flat parts for laser, CNC or hand cutting, with assembly steps, plus tools for 3D printing and casting. A free Mac app for Apple silicon.
repo_url: https://github.com/peterkatz/refab-artist
repo_name: peterkatz/refab-artist
# The repository's docs/ folder holds specs and requirement documents; it is
# not published. The user guide lives in guide/.
docs_dir: guide
exclude_docs: |
  requirements.txt
site_dir: build/site
copyright: Copyright &copy; 2026 Pete Katz. Released under the GNU General Public License, version 3.

theme:
  name: material
  language: en
  logo: assets/refab-artist-icon.png
  favicon: assets/favicon.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/refab.css

nav:
  - Home: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Cut-sheet modes:
      - Stacked: stacked.md
      - Interlocked: interlocked.md
      - Radial: radial.md
      - Curve: curve.md
      - Folded: folded.md
  - Mesh and casting modes:
      - 3D Slices: 3d-slices.md
      - Structures: structures.md
      - Partition: partition.md
      - MotherMold: mothermold.md
      - Inflatables (experimental): inflatables.md
  - Model repair: model-repair.md
  - Exporting: exporting.md
  - Cutting and fit: cutting-and-fit.md
  - Safety: safety.md
  - Troubleshooting: troubleshooting.md
  - Glossary: glossary.md
  - Contributing and licence: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
